policy_version: "1.0"

default_community:
  name: "Default Community"

  thresholds:
    toxicity: 0.70
    severe_toxicity: 0.50
    obscene: 0.70
    threat: 0.40
    insult: 0.70
    identity_attack: 0.60
    sexual_explicit: 0.60

  actions:
    threat: "escalate"
    severe_toxicity: "flag"
    identity_attack: "flag"
    insult: "flag"
    obscene: "flag"
    sexual_explicit: "flag"
    toxicity: "flag"


communities:

  community_demo:

    name: "Demo Community"

    thresholds:
      toxicity: 0.70
      severe_toxicity: 0.50
      obscene: 0.70
      threat: 0.40
      insult: 0.65
      identity_attack: 0.60
      sexual_explicit: 0.60

    actions:
      threat: "escalate"
      severe_toxicity: "remove"
      identity_attack: "flag"
      insult: "flag"
      obscene: "flag"
      sexual_explicit: "flag"
      toxicity: "flag"